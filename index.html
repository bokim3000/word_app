<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>단어카드</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');

/* ════════════════════════════════════════════════════════
   DESIGN TOKENS — 다크 / 라이트 모드
════════════════════════════════════════════════════════ */
:root {
  --accent:      #7c6fff;
  --accent2:     #ff6b9d;
  --green:       #4ade80;
  --red:         #f87171;
  --yellow:      #fbbf24;
  --radius-card: 24px;
  --radius-btn:  16px;
  --font-mono:   'Space Mono', monospace;
  --font-body:   'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  --transition:  0.25s ease;
}
[data-theme="dark"] {
  --bg:       #0f0f13;
  --surface:  #1a1a24;
  --surface2: #22223a;
  --text:     #e8e8f0;
  --muted:    #6b6b80;
  --border:   rgba(124,111,255,0.15);
  --card-f:   linear-gradient(145deg,#1e1e2e,#16162a);
  --card-b:   linear-gradient(145deg,#12122a,#0e0e22);
  --card-shadow: 0 30px 80px rgba(0,0,0,0.5);
}
[data-theme="light"] {
  --bg:       #f4f4fa;
  --surface:  #ffffff;
  --surface2: #eeeef8;
  --text:     #1a1a2e;
  --muted:    #888899;
  --border:   rgba(124,111,255,0.2);
  --card-f:   linear-gradient(145deg,#ffffff,#f0f0ff);
  --card-b:   linear-gradient(145deg,#f5f5ff,#ebebff);
  --card-shadow: 0 20px 60px rgba(124,111,255,0.12);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: var(--font-body);
  touch-action: none;
  transition: background var(--transition), color var(--transition);
}

/* ════════════════════════════════════════════════════════
   SCREEN MANAGER
════════════════════════════════════════════════════════ */
.screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
.screen.active { display: flex; flex-direction: column; }

/* ════════════════════════════════════════════════════════
   SHARED COMPONENTS
════════════════════════════════════════════════════════ */
.screen-header {
  padding: 16px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--border);
  background: transparent; color: var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 18px;
  transition: all 0.2s; flex-shrink: 0;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(124,111,255,0.08); }
.screen-title { font-size: 18px; flex: 1; }
.section-label {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 3px;
  color: var(--muted); text-transform: uppercase; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ════════════════════════════════════════════════════════
   HOME SCREEN
════════════════════════════════════════════════════════ */
#screen-home { overflow-y: auto; }
#screen-home::before {
  content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse at 70% 20%, rgba(124,111,255,0.12) 0%, transparent 55%),
    radial-gradient(ellipse at 10% 85%, rgba(255,107,157,0.08) 0%, transparent 50%);
}
.home-inner { max-width: 400px; width: 100%; margin: 0 auto; padding: 44px 22px 40px; position: relative; z-index: 1; }
.home-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
.logo { font-family: var(--font-mono); font-size: 12px; letter-spacing: 4px; color: var(--accent); opacity: 0.8; }
.topbar-btns { display: flex; gap: 8px; }
.theme-btn, .stats-nav-btn {
  width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border);
  background: transparent; color: var(--muted); cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; transition: all 0.2s;
}
.theme-btn:hover, .stats-nav-btn:hover { border-color: var(--accent); color: var(--accent); }

.home-title { font-size: 28px; line-height: 1.25; margin-bottom: 4px; }
.home-sub   { font-size: 13px; color: var(--muted); margin-bottom: 32px; }

.category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.cat-card {
  border-radius: 16px; padding: 16px; cursor: pointer;
  border: 1.5px solid var(--border); background: var(--surface);
  transition: all 0.2s; position: relative; overflow: hidden;
  display: flex; flex-direction: column; gap: 5px;
}
.cat-card:hover { transform: translateY(-2px); border-color: var(--accent); }
.cat-card::before { content:''; position:absolute; top:-20px; right:-20px; width:80px; height:80px; border-radius:50%; opacity:0.08; }
.cat-card[data-color="purple"]::before { background:#7c6fff; }
.cat-card[data-color="orange"]::before { background:#f97316; }
.cat-card[data-color="blue"]::before   { background:#38bdf8; }
.cat-card[data-color="green"]::before  { background:#4ade80; }
.cat-card[data-color="pink"]::before   { background:#f472b6; }
.cat-icon  { font-size: 22px; }
.cat-name  { font-size: 14px; }
.cat-meta  { display: flex; gap: 6px; align-items: center; }
.cat-count { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.cat-mastered { font-family: var(--font-mono); font-size: 10px; color: var(--green); }

.all-btn {
  width: 100%; height: 50px; border-radius: var(--radius-btn);
  background: linear-gradient(135deg, var(--accent), #5a4fff);
  border: none; color: white; font-family: var(--font-body); font-size: 15px;
  cursor: pointer; transition: all 0.2s; margin-bottom: 28px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.all-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(124,111,255,0.35); }

.my-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.my-deck-card {
  border-radius: 14px; padding: 13px 16px; border: 1.5px solid var(--border);
  background: var(--surface); display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; transition: all 0.2s;
}
.my-deck-card:hover { border-color: var(--yellow); }
.my-deck-left { display: flex; align-items: center; gap: 12px; }
.my-deck-icon { font-size: 20px; }
.my-deck-name  { font-size: 14px; }
.my-deck-count { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 2px; }
.my-deck-del {
  width: 28px; height: 28px; border-radius: 8px; border: 1px solid rgba(248,113,113,0.3);
  background: transparent; color: var(--red); font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0;
}
.my-deck-del:hover { background: rgba(248,113,113,0.15); }
.empty-my {
  text-align: center; padding: 22px; border: 1.5px dashed var(--border);
  border-radius: 14px; color: var(--muted); font-size: 13px; line-height: 1.8;
}
.empty-my span { color: var(--accent); }
.add-btn {
  width: 100%; height: 46px; border-radius: var(--radius-btn);
  border: 1.5px dashed rgba(251,191,36,0.4); background: rgba(251,191,36,0.04);
  color: var(--yellow); font-family: var(--font-body); font-size: 14px;
  cursor: pointer; transition: all 0.2s; position: relative;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.add-btn input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.add-btn:hover { background: rgba(251,191,36,0.1); border-color: var(--yellow); }

/* ════════════════════════════════════════════════════════
   STUDY SCREEN
════════════════════════════════════════════════════════ */
#screen-study { background: var(--bg); }
.study-header {
  padding: 14px 20px 10px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.back-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
  background: transparent; color: var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all 0.2s;
}
.back-btn:hover { border-color: var(--accent); color: var(--accent); }
.progress-info { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.progress-info span { color: var(--text); }
.stats-row { display: flex; gap: 6px; }
.stat-chip { font-family: var(--font-mono); font-size: 11px; padding: 4px 10px; border-radius: 20px; display: flex; align-items: center; gap: 4px; }
.stat-chip.known   { background: rgba(74,222,128,0.12);  color: var(--green);  }
.stat-chip.unknown { background: rgba(248,113,113,0.12); color: var(--red);    }
.progress-bar-wrap { padding: 0 20px 14px; flex-shrink: 0; }
.progress-bar { height: 3px; background: rgba(128,128,128,0.15); border-radius: 2px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; transition: width 0.4s ease; }

/* ── card arena ── */
.card-arena {
  flex: 1; display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden; padding: 16px;
}
.swipe-hint {
  position: absolute; top: 50%; transform: translateY(-50%);
  font-size: 11px; font-family: var(--font-mono); letter-spacing: 1px;
  opacity: 0; transition: opacity 0.2s; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.swipe-hint.left  { left: 14px;  color: var(--green); }
.swipe-hint.right { right: 14px; color: var(--red);   }
.swipe-hint .hint-icon { font-size: 26px; }

/* ── THE CARD ── */
.card-wrapper {
  width: min(340px, 92vw); height: min(460px, 68vh);
  perspective: 1200px; position: relative; cursor: pointer; user-select: none;
  animation: cardIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.card-inner {
  width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
  transition: transform 0.55s cubic-bezier(0.4,0,0.2,1); will-change: transform;
}
.card-inner.flipped { transform: rotateY(180deg); }
.card-face {
  position: absolute; inset: 0; border-radius: var(--radius-card);
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 28px; border: 1px solid var(--border); overflow: hidden;
}
.card-front { background: var(--card-f); box-shadow: var(--card-shadow), 0 0 0 1px rgba(124,111,255,0.1); }
.card-back  { background: var(--card-b); box-shadow: var(--card-shadow), 0 0 0 1px rgba(255,107,157,0.1); transform: rotateY(180deg); }
.card-face::before {
  content:''; position:absolute; top:-60px; right:-60px; width:200px; height:200px; border-radius:50%;
  background: radial-gradient(circle, rgba(124,111,255,0.08) 0%, transparent 70%);
}
.card-back::before { background: radial-gradient(circle, rgba(255,107,157,0.08) 0%, transparent 70%); }

.card-badge { position:absolute; top:18px; right:18px; font-family:var(--font-mono); font-size:10px; letter-spacing:2px; color:rgba(124,111,255,0.5); }
.card-back .card-badge { color:rgba(255,107,157,0.5); }

.penalty-badge {
  position:absolute; top:18px; left:18px;
  background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.25);
  border-radius:8px; padding:3px 8px; font-family:var(--font-mono); font-size:10px; color:var(--red);
}
/* 연속 정답 진행 표시 */
.streak-bar {
  position: absolute; bottom: 18px; left: 28px; right: 28px;
  display: flex; gap: 6px; justify-content: center;
}
.streak-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: rgba(74,222,128,0.2); border: 1px solid rgba(74,222,128,0.3);
  transition: all 0.3s;
}
.streak-dot.filled { background: var(--green); border-color: var(--green); box-shadow: 0 0 6px rgba(74,222,128,0.5); }

/* TTS 버튼 */
.tts-btn {
  position: absolute; bottom: 18px; right: 18px;
  width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--surface2); color: var(--muted); cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center; transition: all 0.2s;
}
.tts-btn:hover { border-color: var(--accent); color: var(--accent); }
.tts-btn.speaking { color: var(--accent); border-color: var(--accent); animation: pulse 1s infinite; }

.card-word    { font-size: clamp(20px,6vw,36px); text-align:center; letter-spacing:-0.5px; line-height:1.3; }
.card-phonetic { margin-top: 6px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-align: center; letter-spacing: 1px; }
.card-tap-hint { position:absolute; bottom:52px; font-size:12px; color:var(--muted); opacity:0.55; }
.card-meaning { font-size: clamp(18px,5.5vw,28px); text-align:center; line-height:1.4; }
.card-example {
  margin-top:16px; font-size:13px; color:var(--muted); text-align:center;
  line-height:1.6; font-style:italic; padding:10px 14px;
  background: rgba(128,128,128,0.06); border-radius:10px; width:100%;
}
.swipe-overlay {
  position:absolute; inset:0; border-radius:var(--radius-card); opacity:0; pointer-events:none;
  display:flex; align-items:center; justify-content:center; font-size:48px;
}
.left-overlay  { background: rgba(74,222,128,0.18); }
.right-overlay { background: rgba(248,113,113,0.18); }

/* ── action row ── */
.swipe-instruction { text-align:center; font-size:11px; color:var(--muted); padding-bottom:10px; flex-shrink:0; font-family:var(--font-mono); letter-spacing:0.5px; }
.action-row { padding:12px 20px 28px; display:flex; gap:14px; justify-content:center; flex-shrink:0; }
.action-btn {
  flex:1; max-width:160px; height:54px; border-radius:var(--radius-btn);
  border:1.5px solid; background:transparent; cursor:pointer;
  font-family:var(--font-body); font-size:15px;
  display:flex; align-items:center; justify-content:center; gap:8px; transition:all 0.2s;
}
.action-btn.known-btn   { border-color:rgba(74,222,128,0.4);  color:var(--green); }
.action-btn.unknown-btn { border-color:rgba(248,113,113,0.4); color:var(--red);   }
.action-btn.known-btn:active,   .action-btn.known-btn:hover   { background:rgba(74,222,128,0.12);  transform:translateY(-2px); }
.action-btn.unknown-btn:active, .action-btn.unknown-btn:hover { background:rgba(248,113,113,0.12); transform:translateY(-2px); }

/* ════════════════════════════════════════════════════════
   DONE SCREEN
════════════════════════════════════════════════════════ */
#screen-done {
  align-items:center; justify-content:center;
  background: radial-gradient(ellipse at 50% 40%, rgba(74,222,128,0.1) 0%, transparent 60%), var(--bg);
}
.done-box    { text-align:center; padding:36px 28px; max-width:320px; width:90%; }
.done-icon   { font-size:60px; margin-bottom:20px; }
.done-title  { font-size:26px; margin-bottom:6px; }
.done-sub    { font-size:13px; color:var(--muted); margin-bottom:28px; line-height:1.6; }
.done-stats  { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:28px; }
.done-stat   { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 10px; }
.done-stat-num   { font-family:var(--font-mono); font-size:24px; font-weight:700; margin-bottom:4px; }
.done-stat-num.green  { color:var(--green);  }
.done-stat-num.red    { color:var(--red);    }
.done-stat-num.yellow { color:var(--yellow); }
.done-stat-label { font-size:11px; color:var(--muted); }
.done-btn {
  width:100%; height:50px; border-radius:14px; border:none; color:white;
  font-family:var(--font-body); font-size:15px; cursor:pointer; transition:all 0.2s; margin-bottom:10px;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.done-btn.primary { background: linear-gradient(135deg,var(--accent),#5a4fff); }
.done-btn.primary:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(124,111,255,0.35); }
.done-btn.secondary { background:var(--surface); border:1.5px solid var(--border); color:var(--muted); }
.done-btn.secondary:hover { border-color:var(--accent); color:var(--accent); }

/* ════════════════════════════════════════════════════════
   STATS SCREEN
════════════════════════════════════════════════════════ */
#screen-stats { background: var(--bg); overflow-y: auto; }
.stats-body { padding: 20px; max-width: 400px; margin: 0 auto; }
.stats-summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 24px; }
.summary-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 12px; text-align: center;
}
.summary-num   { font-family: var(--font-mono); font-size: 26px; font-weight: 700; margin-bottom: 4px; }
.summary-label { font-size: 11px; color: var(--muted); }
.summary-num.accent { color: var(--accent); }
.summary-num.green  { color: var(--green);  }
.summary-num.red    { color: var(--red);    }

/* 카테고리별 진행도 */
.cat-progress-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
.cat-progress-item { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
.cat-progress-top  { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.cat-progress-name { font-size: 14px; display: flex; align-items: center; gap: 8px; }
.cat-progress-pct  { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.cat-bar           { height: 6px; background: rgba(128,128,128,0.15); border-radius: 3px; overflow: hidden; }
.cat-bar-fill      { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.6s ease; }

/* 최근 학습 기록 */
.session-list { display: flex; flex-direction: column; gap: 8px; }
.session-item {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
}
.session-date  { font-size: 13px; }
.session-score { font-family: var(--font-mono); font-size: 12px; }
.session-score.good { color: var(--green); }
.session-score.mid  { color: var(--yellow); }
.session-score.low  { color: var(--red); }

/* ════════════════════════════════════════════════════════
   MASTERED WORDS SCREEN
════════════════════════════════════════════════════════ */
#screen-mastered { background: var(--bg); overflow-y: auto; }
.mastered-body { padding: 20px; max-width: 400px; margin: 0 auto; }
.mastered-empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; line-height: 1.8; }
.mastered-empty .big { font-size: 48px; margin-bottom: 16px; }
.word-list { display: flex; flex-direction: column; gap: 8px; }
.word-item {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; transition: all 0.2s;
}
.word-item:hover { border-color: var(--accent); }
.word-item-left .word-en  { font-size: 15px; margin-bottom: 3px; }
.word-item-left .word-ko  { font-size: 13px; color: var(--muted); }
.word-item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.mastered-badge { font-family: var(--font-mono); font-size: 10px; color: var(--green); background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.2); border-radius: 6px; padding: 2px 8px; }
.miss-badge     { font-family: var(--font-mono); font-size: 10px; color: var(--red);   background: rgba(248,113,113,0.1);  border: 1px solid rgba(248,113,113,0.2);  border-radius: 6px; padding: 2px 8px; }

/* word detail modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; display: flex; align-items: flex-end; }
.modal-overlay.hidden { display: none; }
.modal-sheet {
  background: var(--surface); border-radius: 24px 24px 0 0; padding: 28px 24px 40px;
  width: 100%; max-width: 500px; margin: 0 auto;
  animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }
.modal-word { font-size: 28px; margin-bottom: 4px; }
.modal-phonetic { font-family: var(--font-mono); font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.modal-meaning { font-size: 18px; color: var(--accent); margin-bottom: 12px; }
.modal-example { font-size: 13px; color: var(--muted); line-height: 1.6; font-style: italic; }
.modal-tts-btn {
  margin-top: 16px; padding: 10px 20px; border-radius: 12px; border: 1px solid var(--border);
  background: transparent; color: var(--accent); font-family: var(--font-body); font-size: 14px;
  cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s;
}
.modal-tts-btn:hover { background: rgba(124,111,255,0.1); }

/* ════════════════════════════════════════════════════════
   TOAST & ANIMATIONS
════════════════════════════════════════════════════════ */
.toast {
  position: fixed; bottom: 90px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 20px; font-size: 14px;
  opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 100; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@keyframes cardIn    { from { opacity:0; transform:scale(0.9) translateY(20px); } to { opacity:1; transform:scale(1) translateY(0); } }
@keyframes swipeLeft { to { transform:translateX(-130%) rotate(-20deg); opacity:0; } }
@keyframes swipeRight{ to { transform:translateX( 130%) rotate( 20deg); opacity:0; } }
@keyframes slideUp   { from { transform:translateY(100%); } to { transform:translateY(0); } }
@keyframes pulse     { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
.animate-left  { animation: swipeLeft  0.35s ease-in forwards; }
.animate-right { animation: swipeRight 0.35s ease-in forwards; }

     - 틀린 이력 있음  → 3번 연속 알아요 (중간에 틀리면 리셋)
════════════════════════════════════════════════════════ */
const Storage = (() => {
  const HIST_KEY     = 'wc_history';    // { word: { totalMiss, streak, mastered } }
  const SESSION_KEY  = 'wc_sessions';   // [{ date, known, unknown, total }]
  const THEME_KEY    = 'wc_theme';
  let hist = {}, sessions = [];

  function load() {
    try { hist     = JSON.parse(localStorage.getItem(HIST_KEY)    || '{}'); } catch { hist = {}; }
    try { sessions = JSON.parse(localStorage.getItem(SESSION_KEY) || '[]'); } catch { sessions = []; }
  }
  function saveHist()     { try { localStorage.setItem(HIST_KEY,    JSON.stringify(hist));     } catch {} }
  function saveSessions() { try { localStorage.setItem(SESSION_KEY, JSON.stringify(sessions)); } catch {} }

  // ── 학습 이력 ──
  function get(word)      { return hist[word] || { totalMiss:0, streak:0, mastered:false }; }
  function getMiss(word)  { return get(word).totalMiss; }
  function getStreak(word){ return get(word).streak; }
  function isMastered(w)  { return get(w).mastered; }

  // 틀렸을 때 — 연속정답 리셋
  function addMiss(word) {
    const h = get(word);
    hist[word] = { ...h, totalMiss: h.totalMiss + 1, streak: 0, mastered: false };
    saveHist();
  }

  // 맞았을 때 — 연속정답 +1, 기준 충족 시 mastered
  // requiredStreak: 틀린 이력 없으면 1, 있으면 3
  function addCorrect(word) {
    const h = get(word);
    const required = h.totalMiss > 0 ? 3 : 1;
    const newStreak = h.streak + 1;
    const mastered  = newStreak >= required;
    hist[word] = { ...h, streak: newStreak, mastered };
    saveHist();
    return { mastered, streak: newStreak, required };
  }

  function requiredStreak(word) { return getMiss(word) > 0 ? 3 : 1; }

  // ── 세션 기록 ──
  function saveSession(data) {
    sessions.unshift({ ...data, date: new Date().toLocaleDateString('ko') });
    if (sessions.length > 30) sessions = sessions.slice(0, 30);
    saveSessions();
  }
  function getSessions()  { return sessions; }

  // ── 테마 ──
  function getTheme()       { return localStorage.getItem(THEME_KEY) || 'dark'; }
  function setTheme(t)      { localStorage.setItem(THEME_KEY, t); }

  // ── 통계용 ──
  function getMasteredWords() { return Object.entries(hist).filter(([,v]) => v.mastered).map(([w,v]) => ({word:w,...v})); }
  function getAllHistory()     { return hist; }

  load();
  return { getMiss, getStreak, isMastered, addMiss, addCorrect, requiredStreak,
           saveSession, getSessions, getTheme, setTheme, getMasteredWords, getAllHistory };
})();


/* ════════════════════════════════════════════════════════
   MODULE: TTS  — 텍스트 음성 변환
════════════════════════════════════════════════════════ */
const TTS = (() => {
  const synth = window.speechSynthesis;
  let voice = null;

  // 영어 음성 찾기 (로드 후)
  function findVoice() {
    const voices = synth.getVoices();
    voice = voices.find(v => v.lang === 'en-US' && v.localService) ||
            voices.find(v => v.lang.startsWith('en')) ||
            voices[0];
  }
  if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = findVoice;
  findVoice();

  function speak(text, onEnd) {
    if (!synth) return;
    synth.cancel();
    const utt  = new SpeechSynthesisUtterance(text);
    utt.voice  = voice;
    utt.lang   = 'en-US';
    utt.rate   = 0.9;
    utt.pitch  = 1;
    if (onEnd) utt.onend = onEnd;
    synth.speak(utt);
  }
  function stop() { synth && synth.cancel(); }
  function isSupported() { return !!synth; }

  return { speak, stop, isSupported };
})();


/* ════════════════════════════════════════════════════════
   MODULE: SpacedRepetition
════════════════════════════════════════════════════════ */
const SpacedRepetition = (() => {
  const THRESHOLDS = [
    { misses: 1, delay: 5   },
    { misses: 2, delay: 20  },
    { misses: 3, delay: 100 },
  ];
  function getDelay(totalMiss) {
    const m = [...THRESHOLDS].reverse().find(t => totalMiss >= t.misses);
    return m ? m.delay : 5;
  }
  return { getDelay };
})();


/* ════════════════════════════════════════════════════════
   MODULE: MyDecks
════════════════════════════════════════════════════════ */
const MyDecks = (() => {
  const KEY = 'wc_mydecks';
  let decks = [];
  function load() { try { decks = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { decks=[]; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(decks)); } catch {} }
  function getAll()      { load(); return decks; }
  function add(name, words) {
    load();
    const i = decks.findIndex(d => d.name === name);
    const d = { id: Date.now(), name, savedAt: new Date().toLocaleDateString('ko'), words };
    if (i >= 0) decks[i] = d; else decks.push(d);
    save(); return d;
  }
  function remove(id) { load(); decks = decks.filter(d => d.id !== id); save(); }
  load();
  return { getAll, add, remove };
})();


/* ════════════════════════════════════════════════════════
   MODULE: FileLoader
════════════════════════════════════════════════════════ */
const FileLoader = (() => {
  function parseSheet(ws) {
    const rows  = XLSX.utils.sheet_to_json(ws, { header: 1 });
    const start = (rows[0] && typeof rows[0][0] === 'string' && rows[0][0].toLowerCase().match(/word|english|단어/)) ? 1 : 0;
    return rows.slice(start).filter(r => r[0]).map((r, i) => ({
      id: i, word: String(r[0]).trim(), phonetic: '',
      meaning: r[1] ? String(r[1]).trim() : '',
      example: r[2] ? String(r[2]).trim() : '',
    }));
  }
  function loadFile(file, onSuccess, onError) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'binary' });
        const result = {};
        wb.SheetNames.filter(n => !n.startsWith('📋')).forEach(n => {
          const words = parseSheet(wb.Sheets[n]);
          if (words.length > 0) result[n] = words;
        });
        const names = Object.keys(result);
        if (!names.length) { onError('단어를 찾을 수 없어요 🤔'); return; }
        onSuccess(file.name.replace(/\.[^.]+$/, ''), result);
      } catch { onError('파일을 읽을 수 없어요 😅'); }
    };
    reader.readAsBinaryString(file);
  }
  return { loadFile };
})();


/* ════════════════════════════════════════════════════════
   MODULE: Deck  — 학습 큐 (연속정답 기반 완료 처리)
════════════════════════════════════════════════════════ */
const Deck = (() => {
  let queue = [], cursor = 0;
  let stats = { known:0, unknown:0, processed:0, mastered:0 };

  function shuffle(arr) {
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    return a;
  }
  function init(words) {
    queue  = shuffle(words.map(w => ({ ...w, nextAfter: 0, sessionStreak: 0 })));
    cursor = 0;
    stats  = { known:0, unknown:0, processed:0, mastered:0 };
  }
  function current() {
    for (let i=cursor; i<queue.length; i++) { if (queue[i].nextAfter <= stats.processed) { cursor=i; return queue[i]; } }
    for (let i=0; i<cursor; i++)            { if (queue[i].nextAfter <= stats.processed) { cursor=i; return queue[i]; } }
    return null;
  }
  function markKnown(card) {
    stats.known++; stats.processed++;
    const result = Storage.addCorrect(card.word);
    card.sessionStreak = result.streak;
    if (result.mastered) {
      stats.mastered++;
      card.nextAfter = queue.length + 9999; // 완료
    } else {
      // 아직 연속정답 부족 — 5장 후 다시
      card.nextAfter = stats.processed + 5;
      const idx = queue.indexOf(card);
      if (idx !== -1) { queue.splice(idx,1); queue.push(card); }
    }
    cursor++; if(cursor>=queue.length) cursor=0;
    return result;
  }
  function markUnknown(card) {
    stats.unknown++; stats.processed++;
    Storage.addMiss(card.word);
    card.sessionStreak = 0;
    card.nextAfter = stats.processed + SpacedRepetition.getDelay(Storage.getMiss(card.word));
    const idx = queue.indexOf(card);
    if (idx !== -1) { queue.splice(idx,1); queue.push(card); }
    if (cursor >= queue.length) cursor = 0;
  }
  function isDone()     { return queue.every(c => c.nextAfter > queue.length+100) || stats.processed >= queue.length*4; }
  function getStats()   { return { ...stats }; }
  function getTotal()   { return queue.length; }
  function getUnknown() { return queue.filter(c => Storage.getMiss(c.word) > 0 && !Storage.isMastered(c.word)); }
  return { init, current, markKnown, markUnknown, isDone, getStats, getTotal, getUnknown };
})();


/* ════════════════════════════════════════════════════════
   MODULE: CardUI
════════════════════════════════════════════════════════ */
const CardUI = (() => {
  const THRESHOLD = 90;
  let drag = { active:false, startX:0, currentX:0 };
  let onKnown, onUnknown;

  function buildStreakDots(word) {
    const required = Storage.requiredStreak(word);
    if (required <= 1) return '';
    const current = Storage.getStreak(word);
    const dots = Array.from({length: required}, (_,i) =>
      `<div class="streak-dot ${i < current ? 'filled' : ''}"></div>`
    ).join('');
    return `<div class="streak-bar">${dots}</div>`;
  }

  function render(card, arena, callbacks) {
    onKnown = callbacks.onKnown; onUnknown = callbacks.onUnknown;
    const old = document.getElementById('activeCard');
    if (old) old.remove();
    const miss = Storage.getMiss(card.word);
    const phonetic = card.phonetic || '';

    arena.insertAdjacentHTML('beforeend', `
      <div class="card-wrapper" id="activeCard">
        <div class="card-inner" id="cardInner">
          <div class="card-face card-front">
            ${miss > 0 ? `<div class="penalty-badge">⚠ ${miss}회 틀림</div>` : ''}
            <div class="card-badge">WORD</div>
            <div class="card-word">${card.word}</div>
            ${phonetic ? `<div class="card-phonetic">${phonetic}</div>` : ''}
            <div class="card-tap-hint">✦ 탭해서 뜻 보기</div>
            ${buildStreakDots(card.word)}
            ${TTS.isSupported() ? `<button class="tts-btn" id="ttsFront" title="발음 듣기">🔊</button>` : ''}
            <div class="swipe-overlay left-overlay"  id="ol1">✓</div>
            <div class="swipe-overlay right-overlay" id="or1">✗</div>
          </div>
          <div class="card-face card-back">
            <div class="card-badge">MEANING</div>
            <div class="card-meaning">${card.meaning || '뜻 없음'}</div>
            ${card.example ? `<div class="card-example">${card.example}</div>` : ''}
            <div class="swipe-overlay left-overlay"  id="ol2">✓</div>
            <div class="swipe-overlay right-overlay" id="or2">✗</div>
          </div>
        </div>
      </div>`);

    const wrapper = document.getElementById('activeCard');
    attachGestures(wrapper);

    // TTS 버튼
    const ttsBtn = document.getElementById('ttsFront');
    if (ttsBtn) {
      ttsBtn.addEventListener('click', e => {
        e.stopPropagation();
        ttsBtn.classList.add('speaking');
        TTS.speak(card.word, () => ttsBtn.classList.remove('speaking'));
      });
    }
  }

  // 연속정답 후 도트 업데이트 (카드 재등장 시)
  function updateStreakDots(word) {
    const bar = document.querySelector('.streak-bar');
    if (!bar) return;
    const required = Storage.requiredStreak(word);
    const current  = Storage.getStreak(word);
    bar.innerHTML = Array.from({length: required}, (_,i) =>
      `<div class="streak-dot ${i < current ? 'filled' : ''}"></div>`
    ).join('');
  }

  function flip() { const i=document.getElementById('cardInner'); if(i) i.classList.toggle('flipped'); }

  function animateOut(dir, cb) {
    const w = document.getElementById('activeCard');
    if (!w) return;
    TTS.stop();
    w.classList.add(dir==='left' ? 'animate-left' : 'animate-right');
    setTimeout(cb, 350);
  }

  function setOverlays(dx) {
    const r=Math.min(Math.abs(dx)/100,1), isL=dx<0;
    ['ol1','ol2'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.opacity=isL?r:0;});
    ['or1','or2'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.opacity=isL?0:r;});
    const hL=document.getElementById('hintLeft'), hR=document.getElementById('hintRight');
    if(hL)hL.style.opacity=isL?r*0.9:0;
    if(hR)hR.style.opacity=isL?0:r*0.9;
  }
  function clearOverlays() {
    ['ol1','ol2','or1','or2','hintLeft','hintRight'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.opacity=0;});
  }
  function attachGestures(wrapper) {
    wrapper.addEventListener('click', ()=>{ if(Math.abs(drag.currentX-drag.startX)<10) flip(); });
    const onStart=e=>{drag.active=true;const p=e.touches?e.touches[0]:e;drag.startX=drag.currentX=p.clientX;};
    const onMove =e=>{
      if(!drag.active)return; if(e.cancelable)e.preventDefault();
      const p=e.touches?e.touches[0]:e; drag.currentX=p.clientX;
      const dx=drag.currentX-drag.startX;
      wrapper.style.cssText=`transform:translateX(${dx}px) rotate(${dx*0.08}deg);transition:none;`;
      setOverlays(dx);
    };
    const onEnd=()=>{
      if(!drag.active)return; drag.active=false; clearOverlays();
      const dx=drag.currentX-drag.startX;
      if(dx<-THRESHOLD)      animateOut('left',  onKnown);
      else if(dx>THRESHOLD)  animateOut('right', onUnknown);
      else { wrapper.style.cssText='transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);'; wrapper.style.transform=''; }
    };
    wrapper.addEventListener('touchstart',onStart,{passive:true});
    wrapper.addEventListener('touchmove', onMove, {passive:false});
    wrapper.addEventListener('touchend',  onEnd);
    wrapper.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove',  onMove);
    window.addEventListener('mouseup',    onEnd);
  }
  return { render, animateOut, updateStreakDots };
})();


/* ════════════════════════════════════════════════════════
   MODULE: UI
════════════════════════════════════════════════════════ */
const UI = (() => {
  function showScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
  function updateHeader() {
    const s=Deck.getStats();
    document.getElementById('cardIndex').textContent    = s.processed+1;
    document.getElementById('cardTotal').textContent    = Deck.getTotal();
    document.getElementById('knownCount').textContent   = s.known;
    document.getElementById('unknownCount').textContent = s.unknown;
    document.getElementById('progressFill').style.width = (s.processed/Deck.getTotal()*100)+'%';
  }
  function showToast(msg) {
    const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2500);
  }
  function showDone(stats, sessionWords) {
    document.getElementById('doneKnown').textContent    = stats.known;
    document.getElementById('doneUnknown').textContent  = stats.unknown;
    document.getElementById('doneMastered').textContent = stats.mastered;
    const pct=Math.round(stats.known/(stats.known+stats.unknown)*100)||0;
    document.getElementById('doneMessage').textContent =
      pct===100 ? '완벽해요! 🔥' : pct>=80 ? `정답률 ${pct}% 👏` : pct>=50 ? `정답률 ${pct}% 💪` : `계속 연습해요! 정답률 ${pct}% 📚`;
    showScreen('screen-done');
  }
  return { showScreen, updateHeader, showToast, showDone };
})();

/* ════════════════════════════════════════════════════════
   MODULE: App  — 최상위 컨트롤러
════════════════════════════════════════════════════════ */
const App = (() => {
  let currentWords = [];
  let currentDeckName = '';

  function startSession(words, deckName) {
    if (!words?.length) { UI.showToast('단어가 없어요 🤔'); return; }
    currentWords = words; currentDeckName = deckName || '전체';
    Deck.init(words);
    UI.showScreen('screen-study'); UI.updateHeader(); nextCard();
  }

  function nextCard() {
    if (Deck.isDone()) {
      const stats = Deck.getStats();
      Storage.saveSession({ ...stats, total: Deck.getTotal(), deckName: currentDeckName });
      UI.showDone(stats);
      return;
    }
    const card = Deck.current();
    if (!card) { UI.showDone(Deck.getStats()); return; }
    UI.updateHeader();
    CardUI.render(card, document.getElementById('cardArena'), {
      onKnown: () => {
        const result = Deck.markKnown(card);
        UI.updateHeader();
        if (result.mastered) UI.showToast(`🏆 마스터! "${card.word.split(' ')[0]}..."`);
        else if (result.required > 1) {
          UI.showToast(`✓ ${result.streak}/${result.required} 연속 정답!`);
        }
        setTimeout(nextCard, 50);
      },
      onUnknown: () => { Deck.markUnknown(card); UI.updateHeader(); setTimeout(nextCard, 50); },
    });
  }

  function renderHome() {
    const grid = document.getElementById('builtinGrid');
    grid.innerHTML = '';
    BuiltinData.getAll().forEach(cat => {
      const mastered = cat.words.filter(w => Storage.isMastered(w.word)).length;
      const card = document.createElement('div');
      card.className = 'cat-card'; card.dataset.color = cat.color;
      card.innerHTML = `
        <div class="cat-icon">${cat.icon}</div>
        <div class="cat-name">${cat.name}</div>
        <div class="cat-meta">
          <span class="cat-count">${cat.words.length}개</span>
          ${mastered > 0 ? `<span class="cat-mastered">✓${mastered}</span>` : ''}
        </div>`;
      card.addEventListener('click', () => startSession(cat.words, cat.name));
      grid.appendChild(card);
    });
    renderMyDecks();
    document.getElementById('allBuiltinBtn').textContent = `✦ 전체 기본팩 ${BuiltinData.getAllWords().length}개 한번에 학습`;
  }

  function renderMyDecks() {
    const list  = document.getElementById('myDeckList');
    const decks = MyDecks.getAll();
    list.innerHTML = '';
    if (!decks.length) {
      list.innerHTML = `<div class="empty-my">아직 내 단어장이 없어요<br><span>+ 엑셀 파일 추가</span>를 눌러 추가하세요<br><span style="font-size:11px;opacity:0.6">한번 추가하면 폰에 저장돼요 📱</span></div>`;
      return;
    }
    decks.forEach(deck => {
      const card = document.createElement('div'); card.className = 'my-deck-card';
      card.innerHTML = `
        <div class="my-deck-left">
          <div class="my-deck-icon">📖</div>
          <div>
            <div class="my-deck-name">${deck.name}</div>
            <div class="my-deck-count">${deck.words.length}개 · ${deck.savedAt} 저장</div>
          </div>
        </div>
        <button class="my-deck-del" data-id="${deck.id}">✕</button>`;
      card.addEventListener('click', e => {
        if (e.target.closest('.my-deck-del')) return;
        startSession(deck.words, deck.name);
      });
      card.querySelector('.my-deck-del').addEventListener('click', e => {
        e.stopPropagation();
        if (confirm(`"${deck.name}" 단어장을 삭제할까요?`)) { MyDecks.remove(deck.id); renderMyDecks(); }
      });
      list.appendChild(card);
    });
  }

  function handleFile(file) {
    if (!file) return;
    FileLoader.loadFile(file,
      (baseName, sheets) => {
        const names = Object.keys(sheets);
        names.forEach(n => MyDecks.add(n==='Sheet1' ? baseName : n, sheets[n]));
        renderMyDecks();
        UI.showToast(names.length===1 ? `"${names[0]}" 저장됐어요 📱` : `${names.length}개 시트 저장됐어요 📱`);
        if (names.length === 1) startSession(sheets[names[0]], names[0]);
      },
      msg => UI.showToast(msg)
    );
  }

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('themeBtn').textContent = t === 'dark' ? '🌙' : '☀️';
    Storage.setTheme(t);
  }

  function init() {
    // 저장된 테마 적용
    applyTheme(Storage.getTheme());
    renderHome();

    // 파일
    const fi = document.getElementById('fileInput');
    fi.addEventListener('change', e => { handleFile(e.target.files[0]); fi.value=''; });

    // 전체 학습
    document.getElementById('allBuiltinBtn').addEventListener('click', () => startSession(BuiltinData.getAllWords(), '전체'));

    // 테마
    document.getElementById('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      applyTheme(cur==='dark' ? 'light' : 'dark');
    });

    // 통계 화면
    document.getElementById('statsNavBtn').addEventListener('click', () => { StatsUI.render(); UI.showScreen('screen-stats'); });
    document.getElementById('statsBackBtn').addEventListener('click', () => UI.showScreen('screen-home'));

    // 학습 버튼
    document.getElementById('knownBtn').addEventListener('click', () => {
      const card = Deck.current();
      CardUI.animateOut('left', () => {
        const result = Deck.markKnown(card); UI.updateHeader();
        if (result.mastered) UI.showToast(`🏆 마스터! "${card.word.split(' ')[0]}..."`);
        else if (result.required > 1) UI.showToast(`✓ ${result.streak}/${result.required} 연속 정답!`);
        setTimeout(nextCard, 50);
      });
    });
    document.getElementById('unknownBtn').addEventListener('click', () => {
      const card = Deck.current();
      CardUI.animateOut('right', () => { Deck.markUnknown(card); UI.updateHeader(); setTimeout(nextCard, 50); });
    });

    // 뒤로가기
    document.getElementById('backBtn').addEventListener('click', () => {
      if (confirm('학습을 중단하고 홈으로 돌아갈까요?')) { TTS.stop(); renderHome(); UI.showScreen('screen-home'); }
    });

    // 완료 화면
    document.getElementById('restartBtn').addEventListener('click', () => {
      const unknown = Deck.getUnknown();
      startSession(unknown.length > 0 ? unknown : currentWords, currentDeckName);
    });
    document.getElementById('masteredListBtn').addEventListener('click', () => {
      MasteredUI.render(currentWords); UI.showScreen('screen-mastered');
    });
    document.getElementById('homeBtn').addEventListener('click', () => { renderHome(); UI.showScreen('screen-home'); });

    // 완료 단어 목록 (홈에서도 접근)
    document.getElementById('masteredBackBtn').addEventListener('click', () => UI.showScreen('screen-home'));
    document.getElementById('masteredTtsAllBtn').addEventListener('click', () => {
      const mastered = BuiltinData.getAllWords().filter(w => Storage.isMastered(w.word));
      if (!mastered.length) { UI.showToast('아직 마스터한 단어가 없어요'); return; }
      let i = 0;
      function speakNext() { if (i < mastered.length) { TTS.speak(mastered[i++].word, speakNext); } }
      speakNext();
    });

    // 모달 닫기
    document.getElementById('wordModal').addEventListener('click', e => {
      if (e.target === document.getElementById('wordModal')) {
        document.getElementById('wordModal').classList.add('hidden');
        TTS.stop();
      }
    });
  }

  return { init };
})();

App.init();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(err => console.error('SW registration failed:', err));
  });
}
</script>

</body>
</html>
